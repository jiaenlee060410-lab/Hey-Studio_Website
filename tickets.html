<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#080617" />
  <title>MEMORA — Tickets</title>
  <style>
    :root{--ink:#f8f6ff;--muted:#bdb6ce;--cyan:#67edff;--violet:#b383ff;--line:rgba(226,218,255,.2);--night:#080617}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 88% 0,#402378,transparent 28rem),radial-gradient(circle at 0 80%,#073d60,transparent 30rem),var(--night);font-family:Arial,"Noto Sans SC","Noto Sans KR",sans-serif}.shell{width:min(1080px,calc(100% - 48px));margin:auto}.noise{position:fixed;inset:0;pointer-events:none;opacity:.055;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}.header{position:relative;z-index:2;height:86px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{position:relative;display:block;width:155px;height:58px;overflow:hidden}.logo img{position:absolute;top:-49px;left:-28px;width:210px;height:auto;filter:drop-shadow(0 0 10px rgba(169,132,255,.55))}.back{color:#d9d3e6;font:.7rem monospace;letter-spacing:.1em;text-decoration:none}.back:hover{color:var(--cyan)}main{padding:65px 0 85px}.eyebrow{margin:0;color:var(--cyan);font:.68rem monospace;letter-spacing:.18em}.title{max-width:680px;margin:14px 0 12px;font-size:clamp(3rem,7vw,6.7rem);line-height:.88;letter-spacing:-.09em}.lead{max-width:510px;margin:0;color:var(--muted);line-height:1.8}.booking{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;margin-top:45px}.panel{border:1px solid var(--line);border-radius:23px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.025));backdrop-filter:blur(18px)}.options{padding:24px}.panel h2{margin:0 0 20px;font-size:1.1rem;letter-spacing:-.03em}.ticket-option{position:relative;display:block;width:100%;margin:10px 0;padding:20px;text-align:left;border:1px solid rgba(255,255,255,.15);border-radius:16px;background:rgba(3,2,16,.23);color:var(--ink);cursor:pointer;transition:.25s}.ticket-option:hover,.ticket-option.selected{border-color:var(--cyan);background:rgba(76,220,255,.1);box-shadow:0 0 23px rgba(91,229,255,.14)}.ticket-option.selected:after{content:'SELECTED';position:absolute;right:17px;top:17px;color:var(--cyan);font:.58rem monospace;letter-spacing:.1em}.ticket-option strong{display:block;font-size:1.02rem}.ticket-option small{display:block;margin-top:7px;color:var(--muted);line-height:1.55}.price{position:absolute;right:18px;bottom:17px;color:#fff;font:700 1.2rem monospace}.date-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.date{padding:10px 12px;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:rgba(0,0,0,.17);color:#e3deef;font:.67rem monospace;cursor:pointer}.date.active,.date:hover{border-color:var(--violet);background:rgba(172,123,255,.16)}.summary{align-self:start;padding:27px;position:sticky;top:20px}.summary dl{margin:0}.summary div{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.11);color:#c8c0d7;font-size:.9rem}.summary dt,.summary dd{margin:0}.summary dd{color:#fff;font-weight:700}.summary .total{padding-top:20px;border:0;font-size:1.1rem}.summary .total dd{color:var(--cyan);font-size:1.45rem}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;color:#c9c1d7;font-size:.72rem}.field input,.field select{width:100%;min-height:43px;padding:0 11px;border:1px solid rgba(255,255,255,.2);border-radius:9px;background:rgba(3,2,16,.42);color:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--cyan)}.buy{width:100%;min-height:48px;margin-top:13px;border:0;border-radius:999px;background:linear-gradient(110deg,#fff,#a6efff 53%,#caa2ff);color:#16072f;font-weight:900;letter-spacing:.08em;cursor:pointer;transition:.25s}.buy:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(85,220,255,.34)}.notice{margin:16px 0 0;color:#928ba8;font:.62rem/1.65 monospace}.success{display:none;margin-top:18px;padding:14px;border:1px solid rgba(105,242,255,.5);border-radius:12px;background:rgba(70,227,255,.1);color:#cef9ff;line-height:1.6}.success.show{display:block}@media(max-width:750px){.shell{width:calc(100% - 30px)}.booking{grid-template-columns:1fr}.summary{position:static}.title{font-size:clamp(3rem,16vw,5rem)}main{padding-top:42px}.logo{width:130px}.logo img{width:182px;top:-40px;left:-27px}}
  </style>
</head>
<body>
  <div class="noise"></div>
  <header class="shell header"><a class="logo" href="./index.html" aria-label="Back to MEMORA"><img src="./assets/logo.png" alt="MEMORA logo" /></a><a class="back" href="./index.html">← BACK TO EXPERIENCE</a></header>
  <main class="shell"><p class="eyebrow">MEMORA / TICKET OFFICE</p><h1 class="title">RESERVE<br />YOUR MEMORY.</h1><p class="lead">选择你的进入方式。每张票均包含 The Egg XR 体验、四层 Memory Key 路线与 MEMORA 最终舞台。</p>
    <div class="booking"><section class="panel options"><h2>01 / 选择票种</h2><button class="ticket-option selected" type="button" data-name="MEMORY PASS" data-price="88"><strong>MEMORY PASS</strong><small>2F–4F 四层探索路线 · 标准入场</small><span class="price">¥88</span></button><button class="ticket-option" type="button" data-name="IMMERSIVE PASS" data-price="168"><strong>IMMERSIVE PASS</strong><small>全层体验 · 优先入场 · Memory Key 套装</small><span class="price">¥168</span></button><button class="ticket-option" type="button" data-name="FINAL STAGE VIP" data-price="298"><strong>FINAL STAGE VIP</strong><small>全层体验 · Final Stage 前排 · 限定纪念礼</small><span class="price">¥298</span></button><h2 style="margin-top:28px">02 / 选择日期</h2><div class="date-row"><button class="date active" type="button">2026.05.16</button><button class="date" type="button">2026.05.17</button><button class="date" type="button">2026.05.23</button><button class="date" type="button">2026.05.24</button></div></section>
      <aside class="panel summary"><h2>订单摘要</h2><dl><div><dt>票种</dt><dd id="summary-name">MEMORY PASS</dd></div><div><dt>场次</dt><dd id="summary-date">2026.05.16</dd></div><div><dt>数量</dt><dd><select id="quantity" aria-label="Ticket quantity"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></dd></div><div class="total"><dt>总计</dt><dd id="total">¥88</dd></div></dl><div class="field"><label for="name">购票人姓名</label><input id="name" placeholder="请输入姓名" /></div><div class="field"><label for="email">电子邮箱</label><input id="email" type="email" placeholder="name@example.com" /></div><button class="buy" id="buy" type="button">前往安全结算 →</button><p class="notice">这是一个演示购票页。接入真实支付前，请替换结算按钮的处理逻辑。</p><div class="success" id="success">订单已创建：MEMORA 将把下一步确认信息发送到你的邮箱。</div></aside></div>
  </main>
  <script>
    let selected={name:'MEMORY PASS',price:88,date:'2026.05.16'};const nameEl=document.querySelector('#summary-name'),dateEl=document.querySelector('#summary-date'),quantity=document.querySelector('#quantity'),total=document.querySelector('#total');function update(){nameEl.textContent=selected.name;dateEl.textContent=selected.date;total.textContent=`¥${selected.price*Number(quantity.value)}`}document.querySelectorAll('.ticket-option').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.ticket-option').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');selected.name=button.dataset.name;selected.price=Number(button.dataset.price);update()}));document.querySelectorAll('.date').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.date').forEach(item=>item.classList.remove('active'));button.classList.add('active');selected.date=button.textContent;update()}));quantity.addEventListener('change',update);document.querySelector('#buy').addEventListener('click',()=>{const name=document.querySelector('#name').value.trim(),email=document.querySelector('#email').value.trim();if(!name||!email){alert('请先填写姓名和电子邮箱。');return}document.querySelector('#success').classList.add('show')});
  </script>
</body>
</html>
